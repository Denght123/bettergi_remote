services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      LISTEN_ADDRESS: ":8080"
      WEB_ROOT: /app/web
      MAX_CONNECTIONS: "200"
      ALLOWED_ORIGIN: https://${DOMAIN}
    networks:
      - private

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      - relay
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - private

networks:
  private:

volumes:
  caddy_data:
  caddy_config:
